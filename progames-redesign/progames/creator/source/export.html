<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Creator model build</title></head><body><h1>PRO GAMES CREATOR — model source</h1><p id="status">Preparing model generator…</p><button id="download" disabled>Generate and download GLB</button><script type="module">
import {buildModel} from './model.js';import {GLTFExporter} from '../vendor/GLTFExporter.js';
window.build=async()=>{const root=await buildModel();const hidden=[];root.traverse(o=>{if(!o.visible){hidden.push(o.name);o.userData.defaultScale=o.scale.toArray();o.visible=true;o.scale.set(0,0,0);}});root.userData.defaultHidden=hidden;const data=await new GLTFExporter().parseAsync(root,{binary:true,onlyVisible:false,maxTextureSize:1024});const bytes=new Uint8Array(data);let raw='';for(let i=0;i<bytes.length;i+=32768)raw+=String.fromCharCode(...bytes.subarray(i,i+32768));const nodes=[],materials=new Set();let triangles=0;root.traverse(o=>{nodes.push({name:o.name,type:o.type,optional:!!o.userData.optional,branding:!!o.userData.branding});if(o.isMesh){triangles+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;for(const m of [o.material].flat())materials.add(m.name||m.type);}});return{base64:btoa(raw),manifest:{model:root.name,version:root.userData.version,triangles,nodes,materials:[...materials],defaultHidden:hidden}};};document.querySelector('#status').textContent='Ready. This source regenerates the modular reference model.';const button=document.querySelector('#download');button.disabled=false;button.onclick=async()=>{button.disabled=true;try{const r=await window.build(),bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:'model/gltf-binary'})),a=document.createElement('a');a.href=url;a.download='double-strike.glb';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);document.querySelector('#status').textContent='GLB exported.';}catch(e){document.querySelector('#status').textContent=e.message;}finally{button.disabled=false;}};
</script></body></html>
